<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Dark Blue Ribbon Segment -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Vibrant Green Ribbon Segment -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />

  <!-- Stylized L Group -->
  <g filter="url(#shadow)">
    <!-- Vertical Spine (Dark Blue Curve) -->
    <path d="M 160 110
             C 160 110, 215 110, 215 160
             L 215 320
             C 215 365, 180 390, 160 390
             C 145 390, 140 375, 145 360
             L 160 110 Z"
          fill="url(#blueGrad)" />

    <!-- Overlapping Horizontal Base (Vibrant Emerald Green Flow) -->
    <path d="M 185 270
             C 185 270, 215 255, 240 270
             L 320 330
             C 355 355, 375 355, 375 330
             C 375 310, 345 285, 310 260
             L 230 200
             C 200 180, 185 200, 185 230
             Z"
          fill="url(#greenGrad)" opacity="0.95" />

    <!-- Modern Ribbon Fold "L" Layer -->
    <path d="M 160 110
             C 160 90, 180 80, 200 95
             L 220 110
             L 220 310
             C 220 360, 260 380, 320 380
             L 360 380
             C 375 380, 380 395, 365 405
             C 340 420, 280 425, 210 400
             C 160 380, 160 340, 160 310
             Z"
          fill="url(#greenGrad)" />
  </g>
</svg>
